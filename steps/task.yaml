version: 1
description: Answer an @mention (read-only); the reply is posted as a comment
params:
  prompt: {type: prompt, default: {file: prompts/task.md}}
agent:
  runtime: runtimes/claude-code
  prompt: {param: prompt}
result:
  as: task
  schema:
    type: object
    required: [decision, body]
    properties:
      decision: {type: string, enum: [reply, blocked]}
      body: {type: string}
github: {contents: read}
steer: [comment]
# An environment failure (the sandbox reports it on step_finished) waits for the platform to
# recover, then resumes the same run (ADR-0026). No timeout, no retry spent.
platform_wait:
  - kind: disk_full
    until: {platform: {fact: sandbox.disk_pct, op: lt, value: 85}}
  - kind: oom
    until: {platform: {fact: sandbox.healthy, op: eq, value: true}}
