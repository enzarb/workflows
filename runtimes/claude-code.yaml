version: 1
description: >-
  Claude Code over the Agent Client Protocol, through claude-agent-acp
  (npm @agentclientprotocol/claude-agent-acp), installed with mise. The
  user's Claude OAuth token is the user-scope secret `claude_token`, exposed to
  the agent as CLAUDE_CODE_OAUTH_TOKEN.
install:
  mise:
    - node@22
    - "npm:@agentclientprotocol/claude-agent-acp@0.92.0"
launch:
  protocol: acp
  command: [claude-agent-acp]
  env:
    DISABLE_AUTOUPDATER: "1"
    # A step ends with the agent's turn: a command started in the background is lost and the
    # step finishes without its result (enzarb#303). Commands run in the foreground only.
    CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
capabilities:
  sessions: true
  resume: true
  steering: true
  interactive: true
  structured_output: true
secrets:
  - {name: claude_token, scope: user, env: CLAUDE_CODE_OAUTH_TOKEN}
