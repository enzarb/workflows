name: "on: handler — closing the issue while the triage agent runs stops the step and ends the task"
workflow: workflows/issue.yaml
document:
  task: {repo: acme/app, default_branch: main}
  subjects: {issue: {repo: acme/app, number: 7, title: Crash, author: alice}}
start: {type: issue, action: opened, number: 7}
events:
  - fact: {fact: dependencies, value: []}
  - event: {type: comment, body: /plan, command: plan, actor: {login: maint, can_write: true}}
    expect: {at: triage/triage, status: running}
  - event: {type: issue, action: closed, number: 7}
    expect: {effects: [stop_step], status: ended:closed}
expect:
  status: ended:closed
  path: [dependencies/check, dependencies/wait, dependencies/done, start_gate/wait, start_gate/done, triage/triage]
