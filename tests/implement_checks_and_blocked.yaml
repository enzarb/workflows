name: implement — failing checks go back to the agent with the log; a blocked agent waits for /retry
workflow: workflows/issue.yaml
document:
  task: {repo: acme/app, default_branch: main}
  subjects: {issue: {repo: acme/app, number: 7, title: Crash, author: alice}}
start: {type: issue, action: opened, number: 7}
actions:
  open_pull_request: [{ok: true, result: {kind: pull_request, number: 8, title: "fix(app): x", url: "https://github.com/acme/app/pull/8"}}]
stubs:
  triage/triage: [{result: {decision: ready, body: s}}]
  plan/plan: [{outputs: {plan: p}}]
  implement/prepare: [{}]
  implement/implement:
    - {result: {decision: done, title: "fix(app): x", body: b}, git: {branch: enzarb/issue-7, head: a1, pushed: true}}
    - {result: {decision: blocked, body: "The config format is undocumented."}}
  implement/checks: [{exit: failure, outputs: {checks_log: "test foo ... FAILED"}}]
  implement/retry: [{result: {decision: done, title: "fix(app): x", body: b}, git: {branch: enzarb/issue-7, head: a2, pushed: true}}]
  context: [{outputs: {context: {}}}]
  review/rounds/review: [{result: {verdict: comment, must_fix: [], body: "Could not run the e2e tests.", checks: []}}]
events:
  - fact: {fact: dependencies, value: []}
  - event: {type: comment, body: /plan, command: plan, actor: {login: m, can_write: true}}
    expect: {at: start_gate/verify}
  - fact: {fact: dependencies, value: []}
  - event: {type: comment, body: /approve, command: approve, actor: {login: m, can_write: true}}
    expect: {at: plan/verify}
  - fact: {fact: dependencies, value: []}
    expect:
      at: implement/blocked
      outputs: {checks_log: "test foo ... FAILED"}
      projection: {reason: implement_blocked, column: blocked, text: "The config format is undocumented.", actions: [Retry]}
  - event: {type: comment, body: /retry, command: retry, actor: {login: m, can_write: true}}
    # The review is a plain `comment` with no must-fix items: it waits on a person.
    expect: {at: review/rounds/human, projection: {reason: awaiting_review, needs_you: true}}
  # Closing the PR without merging ends the task (the workflow's `on:` handler).
  - event: {type: pull_request, action: closed, number: 8, merged: false}
expect:
  status: ended:closed
  path: [dependencies/check, dependencies/wait, dependencies/done, start_gate/wait, start_gate/verify,
         start_gate/done, triage/triage, triage/done, plan/check, plan/plan, plan/post, plan/approval,
         plan/verify, plan/done, implement/prepare, implement/implement, implement/checks,
         implement/implement, implement/blocked, implement/retry, implement/open_pr, implement/done,
         review/init, review/rounds, review/rounds/context, review/rounds/review, review/rounds/post_review,
         review/rounds/human]
