name: plan — feedback re-plans, a non-writer /approve is ignored, the writer's approval starts the implementation
workflow: workflows/issue.yaml
document:
  task: {repo: acme/app, default_branch: main}
  subjects: {issue: {repo: acme/app, number: 7, title: Crash on start, author: alice}}
start: {type: issue, action: opened, number: 7}
stubs:
  triage/triage: [{result: {decision: ready, body: summary}}]
  plan/plan:
    - outputs: {plan: "plan v1"}
    - outputs: {plan: "plan v2"}
events:
  - fact: {fact: dependencies, value: []}
  - event: {type: comment, body: /plan, command: plan, actor: {login: maint, can_write: true}}
    expect: {at: plan/approval, outputs: {plan: "plan v1"}}
  - event: {type: comment, body: "Please also handle the empty file.", actor: {login: alice}}
    expect: {at: plan/approval, effects: [run_step, call_action], outputs: {plan: "plan v2"}}
  # enzarb's own comment (the posted plan coming back) is not feedback.
  - event: {type: comment, body: "plan v2", actor: {login: enzarb, bot: true}}
    expect: {at: plan/approval, effects: []}
  - event: {type: comment, body: /approve, command: approve, actor: {login: alice, can_write: false}}
    expect: {at: plan/approval, effects: [reply]}
  - event: {type: comment, body: /approve, command: approve, actor: {login: maint, can_write: true}}
    expect: {at: implement/prepare, status: running}
expect:
  path: [dependencies/check, dependencies/wait, dependencies/done, start_gate/wait, start_gate/done, triage/triage, triage/done,
         plan/check, plan/plan, plan/post, plan/approval, plan/plan, plan/post, plan/approval, plan/done, implement/prepare]
