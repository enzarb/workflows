name: "sub-issue of an epic (`epic_allowed: false` from the binding) — an epic triage and /epic are not followed"
workflow: workflows/issue.yaml
params: {epic_allowed: false}
document:
  task: {repo: acme/app, default_branch: main}
  subjects: {issue: {repo: acme/app, number: 21, title: Widget API, author: enzarb}}
start: {type: issue, action: opened, number: 21}
stubs:
  triage/triage: [{result: {decision: epic, body: "Could be split further."}}]
  plan/plan: [{outputs: {plan: p}}]
events:
  - fact: {fact: dependencies, value: []}
  - event: {type: label, action: added, label: epic, actor: {login: maint, can_write: true}}
    expect: {vars: {}}
  - event: {type: comment, body: /plan, command: plan, actor: {login: maint, can_write: true}}
    expect: {at: plan/approval}
  - event: {type: comment, body: /epic, command: epic, actor: {login: maint, can_write: true}}
    expect: {at: plan/approval, effects: []}
expect:
  path: [dependencies/check, dependencies/wait, dependencies/done, start_gate/wait, start_gate/done, triage/triage, triage/done,
         plan/check, plan/plan, plan/post, plan/approval]
