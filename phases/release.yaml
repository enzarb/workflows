version: 1
description: >-
  After the merge, wait for the release events listed in `when` (`<type>` or
  `<type>.<action|state>`, e.g. `release.published`, `package.published`,
  `deployment.success`, `tag.created`, `workflow_run.completed`). With the default
  `when: []` the phase is done at once. Then the task's issue is closed (if the merged
  pull request did not close it).
params:
  when: {type: list, items: string, default: []}
  retry_command: {type: string, default: retry, description: Command (and button) that runs a failed step again}
  retry_label: {type: string, default: Retry, description: Label of the retry button}
exits: []
start: check
nodes:
  check:
    decide: {}
    next:
      - {if: "params.when | length == 0", to: finish}
      - {else: wait}
  wait:
    wait:
      events:
        - release
        - package
        - deployment
        - tag
        - workflow_run
      reason: awaiting_release
      text: "Merged; waiting for {{ params.when | join(', ') }}"
      column: done
      waiting_on: external
    next:
      - {if: "event.type in params.when or (event.type ~ '.' ~ (event.action or event.state or event.status)) in params.when", to: finish}
      - {if: "event.type == 'deployment' and event.state in ['failure', 'error'] and ('deployment.success' in params.when)", to: deploy_failed}
  # Released: close the task's issue when the merged pull request did not (it closes only
  # issues it references with "Closes #N"). Closing a closed issue is a no-op.
  finish:
    decide: {}
    next:
      - {if: "subjects.issue", to: close_issue}
      - {else: done}
  close_issue:
    action:
      name: close_issue
      args: {number: "{{ subjects.issue.number }}", reason: completed}
    next: done
  done: {end: {status: done}}
  # The deployment failed: wait for a writer's /retry (or the Retry button) instead of ending the task.
  deploy_failed:
    wait:
      events:
        - {event: comment, from: writer, if: "event.command == params.retry_command"}
      reason: step_failed
      text: "The deployment failed (details in its session on the task page). /{{ params.retry_command }} to try again"
      column: blocked
      waiting_on: human
      actions: [{label: {param: retry_label}, command: {param: retry_command}}]
    max_visits: 50
    next:
      - {else: wait}
