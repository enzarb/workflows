version: 1
description: >-
  Epic path: write the sub-issue breakdown, post it, wait for approval (feedback re-plans),
  create the sub-issues with `create_issues`, then wait until every sub-issue's task ended.
params:
  prompt: {type: prompt, default: {file: prompts/breakdown.md}}
  max_subissues: {type: integer, default: 8}
  approve_command: {type: string, default: approve}
exits: [closed, failed]
start: breakdown
nodes:
  breakdown:
    step:
      use: steps/breakdown
      with: {prompt: {param: prompt}, max_subissues: {param: max_subissues}, approve_command: {param: approve_command}}
    next:
      - {if: "last.exit == 'success' and outputs.breakdown.issues and outputs.breakdown_plan", to: post}
      - {else: failed}
  post:
    action:
      name: comment
      args: {number: "{{ subjects.issue.number }}", body: "{{ outputs.breakdown_plan }}"}
    next: approval
  approval:
    wait:
      events:
        - {event: comment, if: "not event.actor.bot"}
        - {event: issue, if: "event.action == 'closed'"}
      reason: awaiting_approval
      text: "Review the breakdown of #{{ subjects.issue.number }} into {{ outputs.breakdown.issues | length }} sub-issues: comment feedback, or /{{ params.approve_command }} to create them"
      column: plan
      waiting_on: human
      actions: [{label: Create sub-issues, command: approve}]
    next:
      - {if: "event.type == 'issue'", to: closed}
      - {if: "event.command == params.approve_command and event.actor.can_write", to: create}
      - {if: "not event.command", to: breakdown}
  create:
    action:
      name: create_issues
      # Action args are string templates and there is no `tojson` filter yet: the list is
      # rendered with MiniJinja's value formatting, which is JSON for these plain values.
      args:
        parent: "{{ subjects.issue.number }}"
        issues: "{{ outputs.breakdown.issues }}"
        footer: "Part of the epic #{{ subjects.issue.number }}"
    next:
      - {if: "last.ok", to: children}
      - {else: failed}
  children:
    wait:
      events:
        - all_children_ended
        - {event: issue, if: "event.action == 'closed'"}
      reason: awaiting_children
      text: "Waiting for the sub-issues of #{{ subjects.issue.number }} to finish"
      column: in_progress
      waiting_on: external
    next:
      - {if: "event.type == 'issue'", to: closed}
      - {if: "event.type == 'all_children_ended'", to: done}
  done: {end: {status: done}}
  closed: {end: {status: closed}}
  failed: {end: {status: failed}}
