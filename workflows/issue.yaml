version: 1
description: >-
  Issue to release: dependencies → start gate (/plan) → triage → plan (approval) →
  implement → review → merge (human) → release; epics go triage/plan → breakdown.
board: board
phases:
  - {use: phases/dependencies}
  - {use: phases/start_gate}
  - {use: phases/triage, exits: {epic: breakdown}}
  - {use: phases/plan, exits: {epic: breakdown}}
  - {use: phases/implement}
  - {use: phases/review, exits: {merged: release}, max_entries: 10}
  - {use: phases/merge, exits: {changed: review}, max_entries: 10}
  - {use: phases/release, exits: {done: {end: done}}}
  - {use: phases/breakdown}
