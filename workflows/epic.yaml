version: 1
description: >-
  An issue labelled `epic`: the issue workflow with triage forced to the breakdown path.
  (Bindings cannot pass params yet, so this is its own workflow file.)
board: board
phases:
  - {use: phases/dependencies}
  - {use: phases/start_gate}
  - {use: phases/triage, with: {epic: true}, exits: {epic: breakdown}}
  - {use: phases/breakdown}
