name: enzarb-lint
description: >-
  Validate enzarb workflow definitions (`.enzarb/` or a workflow library) and run their
  scenario tests with enzarb-lint. Usage: `uses: enzarb/workflows/lint@v1`.
inputs:
  path:
    description: Directory to check (a repository root with `.enzarb/`, or a library root)
    default: .
  repo:
    description: "`owner/repo` of the checked directory"
    default: ${{ github.repository }}
  libraries:
    description: "Extra `--library` values, one `<alias|owner/repo>=<path>` per line"
    default: ""
  test:
    description: Also run the scenario tests
    default: "true"
  library-ref:
    description: enzarb/workflows ref served for `enzarb/workflows@...` imports
    default: v1
  enzarb-ref:
    description: enzarb/enzarb ref to build enzarb-lint from
    default: 0b6f85bc5a32d0ed19bf4d99fcd338157da6111e
  token:
    description: >-
      Optional token for the checkouts. enzarb/enzarb and enzarb/workflows are public, so the
      default (the job's token) is enough; set it only for private forks.
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch enzarb-lint sources
      uses: actions/checkout@v4
      with:
        repository: enzarb/enzarb
        ref: ${{ inputs.enzarb-ref }}
        token: ${{ inputs.token || github.token }}
        path: .enzarb-lint-src
    - name: Fetch the standard library
      if: inputs.repo != 'enzarb/workflows'
      uses: actions/checkout@v4
      with:
        repository: enzarb/workflows
        ref: ${{ inputs.library-ref }}
        token: ${{ inputs.token || github.token }}
        path: .enzarb-std
    - name: Cache the build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .enzarb-lint-src/target
        key: enzarb-lint-${{ runner.os }}-${{ inputs.enzarb-ref }}
    - name: Build enzarb-lint
      shell: bash
      # One root Cargo workspace (enzarb/enzarb#257); enzarb-flow has no path dependencies.
      working-directory: .enzarb-lint-src
      run: cargo build --release -p enzarb-flow --bin enzarb-lint
    - name: Lint
      shell: bash
      env:
        LINT_PATH: ${{ inputs.path }}
        LINT_REPO: ${{ inputs.repo }}
        LINT_LIBRARIES: ${{ inputs.libraries }}
        LINT_TEST: ${{ inputs.test }}
      run: |
        set -euo pipefail
        bin="$GITHUB_WORKSPACE/.enzarb-lint-src/target/release/enzarb-lint"
        args=(--repo "$LINT_REPO" --format github)
        if [ -d "$GITHUB_WORKSPACE/.enzarb-std" ]; then
          args+=(--library "enzarb/workflows=$GITHUB_WORKSPACE/.enzarb-std")
        fi
        while IFS= read -r lib; do
          [ -n "$lib" ] && args+=(--library "$lib")
        done <<< "$LINT_LIBRARIES"
        "$bin" check "$LINT_PATH" "${args[@]}"
        if [ "$LINT_TEST" = "true" ]; then
          "$bin" test "$LINT_PATH" "${args[@]}"
        fi
